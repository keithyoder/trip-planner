# Security checks that don't need a database: dependency advisories and static
# analysis. Tests live in tests.yml. RuboCop is intentionally not in CI yet: it
# has a large backlog that needs a baseline first.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # New advisories appear without any code change, so also check weekly (Mon 09:00 UTC).
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  bundler-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      # Installed standalone, not via the Gemfile, so the audit never needs the
      # app's native gems (pg, rgeo, ...) and the lockfile stays free of tooling.
      - run: gem install bundler-audit
      - run: bundler-audit check --update

  brakeman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - run: gem install brakeman
      # Reads config/brakeman.ignore; anything not in it fails the job.
      - run: brakeman -q --no-pager --ignore-config config/brakeman.ignore
